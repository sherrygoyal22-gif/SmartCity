{% extends layout %}
{% block title %}{{ title }} · SmartCity{% endblock %}
{% block content %}<section class="panel error-page"><div class="error-code">{{ code }}</div><h2>{{ title }}</h2><p>{{ message }}</p><a class="button" href="{{ url_for('admin_dashboard') if is_admin else (url_for('staff_dashboard') if is_staff else (url_for('dashboard') if current_user else url_for('login'))) }}">{{ 'Back to dashboard' if current_user else 'Go to login' }}</a></section>{% endblock %}
